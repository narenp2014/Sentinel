[project]
name = "sentinel-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.0",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.47.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "sqlite-utils>=4.2.1",
    "streamlit>=1.64.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
sentinel-project = "sentinel_project:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
